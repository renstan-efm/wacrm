# Builds the wacrm container image for Cloud Run.
#
# NEXT_PUBLIC_* values are baked in at build time, so they are passed as
# substitutions. scripts/deploy-cloud-run.sh fills them from the running
# Cloud Run service so a rebuild always matches the live settings.
# Server-only secrets are NOT used here; Cloud Run reads them at runtime.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_APP_LOCALE=${_APP_LOCALE}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 1800s
